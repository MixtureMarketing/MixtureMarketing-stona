name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Create .npmrc
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.VITE_SANITY_DATASET }}
          # Puppeteer configuration for CI
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mixture-marketing # Zmień na nazwę swojego projektu w CF Pages
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
