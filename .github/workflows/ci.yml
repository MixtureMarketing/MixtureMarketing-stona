name: CI Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  quality-and-build:
    name: 🛡️ Quality, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Zaktualizowano do nowszej stabilnej wersji
          cache: 'npm'

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 🧪 PHP Syntax Check (Lint)
        run: find public/api -name "*.php" -exec php -l {} \;

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🎨 Linting & Formatting
        run: npm run lint

      - name: 🧪 Unit Tests
        run: npm run test -- --run

      - name: 🏗️ Build & Prerender
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
        run: npm run build

      - name: 📊 Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7 # Zwiększono czas retencji, byś mógł pobrać paczkę do ręcznego wdrożenia
