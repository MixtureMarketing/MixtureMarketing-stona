name: CI Pipeline

on:
  push:
    branches: ['main', 'master']
    # Pomin build dla zmian tylko w dokumentacji/markdown.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: ['main', 'master']
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

# Anuluj duplikaty (np. force-push, kolejne commity w PR) — oszczedza minuty CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # JOB 1: QUALITY — lint + typecheck + tests
  # ============================================================
  quality:
    name: 🛡️ Quality (lint + typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # plytka kopia, ~5s szybciej

      - name: 🛡️ Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Tylko cache npm cache directory (NIE node_modules) — node_modules
          # cachujemy osobno bo zawiera kompilowane bindings (puppeteer chromium).
          cache: 'npm'

      - name: ⚙️ Configure NPM
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: 📦 Cache node_modules + puppeteer
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: 📦 Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🎨 Linting & Formatting
        run: npm run lint

      # TypeScript typecheck — non-blocking (continue-on-error) bo na baseline
      # 2026-05-21 mamy 41 pre-existing errorow w komponentach legacy. CI loguje
      # je w sekcji "Quality" ale deploy nie blokuje. TODO w ROADMAP.md:
      # "Faza 4 — naprawic 41 ts errors w features/audit, abonament/VsWix/VsOrange,
      # pages/Ecommerce/GoogleAds/UiUxDesign" — wtedy zdjac continue-on-error.
      - name: 🔷 TypeScript Typecheck (non-blocking)
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true

      - name: 🧪 Unit Tests
        run: npm run test -- --run

  # ============================================================
  # JOB 2: BUILD & PRERENDER — wymaga quality OK
  # PHP lint job usuniety w maju 2026 — po migracji do CF Workers
  # nie ma juz plikow .php w produkcji.
  # ============================================================
  build:
    name: 🏗️ Build & Prerender
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ⚙️ Configure NPM
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: 📦 Cache node_modules + puppeteer
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: 📦 Install Dependencies (fallback)
        run: npm ci --prefer-offline --no-audit

      - name: 🖼️ Cache converted images
        uses: actions/cache@v4
        with:
          path: public/assets/images/converted
          key: images-${{ hashFiles('public/assets/images/**', 'scripts/convert-images.js') }}

      - name: 🏗️ Build, Sitemap, Prerender, Size-check
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
          # SaaS abonament — inline'owane przez Vite przy build (.env.local equivalent)
          VITE_MM_PREONBOARD_KEY: ${{ secrets.VITE_MM_PREONBOARD_KEY }}
          VITE_MM_HUB_URL: ${{ vars.VITE_MM_HUB_URL || 'https://api.mixturemarketing.pl' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
          PRERENDER_CONCURRENCY: '4'
        run: npm run build

      - name: 🩺 Health Audit (non-blocking)
        run: npm run audit:health
        continue-on-error: true

      - name: 📊 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7

  # ============================================================
  # JOB 3: DEPLOY — tylko main, tylko jezeli build OK
  # cloudflare/wrangler-action@v3 (oficjalny CF action).
  # ============================================================
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📥 Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-package
          path: dist

      # Sanityzacja commit message — wrangler 3.x/4.x ma bug z UTF-8 w commit msg
      # gdy zawiera unicode (—, polskie znaki). CF API zwraca code 8000111.
      # Sklejamy short SHA + bezpieczny prefix zamiast `git log -1`.
      - name: 🧹 Sanitize commit message
        id: commit
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "msg=CI deploy $SHORT_SHA (main)" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=mixturemarketing-stona --branch=main --commit-dirty=true --commit-message="${{ steps.commit.outputs.msg }}" --commit-hash=${{ github.sha }}
