name: CI Pipeline

on:
  push:
    branches: ['main', 'master', 'cloudflare-migration']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: 🛡️ Quality, Test & Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛡️ Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📂 Cache Optimized Images
        uses: actions/cache@v4
        with:
          path: public/assets/images/*.{webp,avif}
          key: ${{ runner.os }}-images-${{ hashFiles('public/assets/images/**/*') }}
          restore-keys: |
            ${{ runner.os }}-images-

      - name: 📂 Cache Puppeteer Browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: 📂 Cache Vite
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: ⚙️ Configure NPM
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=high

      - name: 🎨 Linting & Formatting
        run: npm run lint

      - name: 🔍 Validate CMS Content
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
        run: npm run audit:cms

      - name: 🧪 Unit Tests
        run: npm run test -- --run

      - name: 🏗️ Build & Prerender
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
        run: npm run build

      - name: 🗺️ Validate Sitemap
        run: npm run audit:sitemap

      - name: 🧪 E2E Contact Form Test
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
        run: npm run test:e2e

      - name: 🚀 Deploy to Cloudflare Pages
        if: success() && github.event_name == 'push'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mixturemarketing-stona
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}

      - name: 📊 Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7