name: CI Pipeline

on:
  workflow_dispatch: # reczne odpalenie z zakladki Actions (omija problem pustych commitow + paths-ignore)
  push:
    branches: ['main', 'master', 'dev']
    # Pomin build dla zmian tylko w dokumentacji/markdown.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: ['main', 'master']
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

# Anuluj duplikaty (np. force-push, kolejne commity w PR) — oszczedza minuty CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Konkretna wersja zamiast '22': setup-node bierze wtedy dowolne 22.x z toolcache
  # runnera, a @sanity/client 8, @portabletext/react 8 i puppeteer 25 wymagają
  # Node >= 22.12 (ESM-only). Przy podbijaniu trzymać się linii 22 LTS (Jod).
  NODE_VERSION: '22.23.4'

jobs:
  # ============================================================
  # JEDEN JOB: quality + build + deploy (main = produkcja, dev = Preview).
  # Scalone z 3 osobnych jobow (2026-07-11) — usuwa 2x spin-up runnera,
  # 2x checkout, 1x npm ci oraz caly upload/download artefaktu dist.
  # ============================================================
  ci:
    name: 🚀 CI (quality + build + deploy)
    runs-on: ubuntu-latest
    # Typowy run to 5-7 min. Bez limitu zawieszony prerender (Puppeteer / preview na 4173)
    # mielił do domyślnych 6 h minut runnera i blokował kolejne deploye (concurrency).
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          # Pelna historia: gitleaks skanuje zakres commitow PR-a / pusha (`<pierwszy>^..<ostatni>`).
          # Przy fetch-depth: 1 tych commitow nie bylo w klonie — skan konczyl sie
          # "ambiguous argument … scanned ~0 bytes" i nie sprawdzal niczego (ukryte przez
          # continue-on-error). Repo jest male (~160 commitow, ~42 MB), koszt kilka sekund.
          fetch-depth: 0

      # MIX-1613 r2: cel wdrożenia wyznacza skrypt (porównanie ref czułe na wielkość liter; wyrażenie
      # `==` w Actions takie nie jest, więc `DEV` albo `Dev` przeszłoby jako dev). Jedyne źródło prawdy
      # dla kroków niżej: target=prod (push main) | preview (push albo ręczne uruchomienie na dev) | none.
      - name: 🎯 Resolve deploy target
        id: target
        run: bash scripts/ci-deploy-guard.sh target >> "$GITHUB_OUTPUT"

      - name: 🛡️ Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Na razie nieblokujaco — po kilku zielonych przebiegach z realnym skanem do zdjecia.
        continue-on-error: true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ⚙️ Configure NPM
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: 📦 Cache node_modules + puppeteer
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: 📦 Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🎨 Linting & Formatting
        run: npm run lint

      # TypeScript typecheck — blokujacy od 2026-10-24 (baseline zszedl do 0 bledow).
      - name: 🔷 TypeScript Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Pages Functions (runtime Workers) — osobny tsconfig z @cloudflare/workers-types.
      - name: 🔷 TypeScript Typecheck (functions)
        run: npx tsc --noEmit -p functions/tsconfig.json

      - name: 🧪 Unit Tests
        run: npm run test -- --run

      # (Usunieto krok "Cache converted images" — cache'owal nieistniejacy katalog
      #  public/assets/images/converted. webp/avif sa commitowane, a convert-images.js
      #  pomija je po hashu tresci -> konwersja w CI jest natychmiastowa.)

      - name: 🏗️ Build, Sitemap, Prerender, Size-check
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
          # SaaS abonament — inline'owane przez Vite przy build (.env.local equivalent)
          VITE_MM_PREONBOARD_KEY: ${{ secrets.VITE_MM_PREONBOARD_KEY }}
          VITE_MM_HUB_URL: ${{ vars.VITE_MM_HUB_URL || 'https://api.mixturemarketing.pl' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Wersja builda w raportach bledow frontu (utils/errorReporter.ts).
          VITE_RELEASE: ${{ github.sha }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
          # Podbite z 4 -> 8: prerender jest I/O-bound (czeka na hydracje/siec),
          # wiec wiecej rownoleglych stron nakłada sie na czasy oczekiwania.
          # Jesli runner zacznie OOM-owac (16GB, ~500MB/strona) — zejsc do 6.
          PRERENDER_CONCURRENCY: '8'
          # MIX-1465: menu mobilne B wlaczone na produkcji; wylaczenie = usunac te linie.
          VITE_MM_MOBILE_MENU_B: '1'
          # MIX-1613 r2 (zasada wlasciciela MIX-1411): kazda scalona funkcja za przelacznikiem VITE_MM_*
          # jest wlaczona w Preview (build dla dev), a na produkcji i w PR wylaczona do `TAK <SHA>`.
          # Lista pochodzi z kodu (tests/scripts/ciWorkflow.test.ts pilnuje kompletnosci).
          VITE_MM_AI_SECTION: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
          VITE_MM_COOKIE_BANNER_STATIC: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
          VITE_MM_LIVE_PRICE_BAR: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
          VITE_MM_POWIAZANE: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
          VITE_MM_RZESZOW_SEKCJE: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
          VITE_MM_TESTIMONIALS: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
          VITE_MM_VIEW_TRANSITIONS: ${{ steps.target.outputs.target == 'preview' && '1' || '' }}
        run: npm run build

      - name: 🩺 Health Audit (non-blocking)
        run: npm run audit:health
        continue-on-error: true

      # --- DEPLOY: tylko push na main (target=prod, patrz krok „Resolve deploy target”) ---
      # Strażnik powtórek (MIX-1613 r2): ponowne uruchomienie starego biegu (re-run, token z
      # Actions:write) ma SHA starego pusha na main. Wdrażamy wyłącznie SHA będące bieżącym końcem
      # main w GitHub (`git ls-remote`); inaczej krok kończy się kodem 1 z linią powodu i deploy
      # nie startuje. Fail-closed: brak odpowiedzi, brak SHA albo niejednoznaczny wynik = odmowa.
      - name: 🔒 Replay guard (SHA = koniec main)
        if: steps.target.outputs.target == 'prod'
        run: bash scripts/ci-deploy-guard.sh main-tip

      # Sanityzacja commit message — wrangler ma bug z UTF-8 w commit msg (code 8000111).
      - name: 🧹 Sanitize commit message
        id: commit
        if: steps.target.outputs.target == 'prod'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "msg=CI deploy $SHORT_SHA (main)" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to Cloudflare Pages
        if: steps.target.outputs.target == 'prod'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          # Bindingi D1/KV/R2 skonfigurowane na projekcie Pages (dashboard).
          command: pages deploy dist --project-name=mixturemarketing-stona --branch=main --commit-dirty=true --commit-message="${{ steps.commit.outputs.msg }}" --commit-hash=${{ github.sha }}

      # --- DEPLOY Preview: push na dev albo reczne uruchomienie (workflow_dispatch) na dev ---
      # (alias dev.mixturemarketing-stona.pages.dev). MIX-1613: webhook Sanity po publikacji
      # uruchamia ten workflow na dev, zeby Preview odswiezyl zrzuty list CMS. main: wylacznie push.
      # Pull requesty nigdy nie wdrazaja; produkcja (main) bez zmian. Ref `dev` rozstrzyga skrypt
      # (case-sensitive): `DEV` i `Dev` nie wdrazaja (krok „Resolve deploy target” konczy sie kodem 1).
      - name: 🧹 Sanitize commit message (dev)
        id: commit_dev
        if: steps.target.outputs.target == 'preview'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "msg=CI deploy $SHORT_SHA (dev)" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to Cloudflare Pages (Preview dev)
        if: steps.target.outputs.target == 'preview'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=mixturemarketing-stona --branch=dev --commit-dirty=true --commit-message="${{ steps.commit_dev.outputs.msg }}" --commit-hash=${{ github.sha }}
