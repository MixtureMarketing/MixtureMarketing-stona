name: ⚡ Fast Deploy (Cloudflare Migration)

on:
  push:
    branches: ['cloudflare-migration']

jobs:
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: ⚙️ Configure NPM
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Project
        # Skip lint, test, audit, size-limit for speed. Just pure build.
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET || 'production' }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
        run: |
          npx vite build
          npm run sitemap
          node prerender.js

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: mixturemarketing-stona
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: cloudflare-migration
