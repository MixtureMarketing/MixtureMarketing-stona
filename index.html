<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Domyslny fallback title — React Helmet podmienia go per strone -->
    <title>Agencja Marketingowa Rzeszów — Mixture Marketing</title>

    <!-- Favicons & App Icons (Google Search Compliance) -->
    <!-- Ikony w docelowych rozmiarach. Wcześniej wszystkie wskazywały sygnet.png 5906×5906
         (211 kB): przeglądarka dekodowała go kilka razy na każdej stronie (150–190 ms/raz
         na głównym wątku), co na mobile dawało sekundy TBT. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#213261" />

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdn.sanity.io" />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />

    <!-- Google Consent Mode v2 Default State -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500,
      });
    </script>

    <!--
      MIX-1579: widoczność banera zgód zapisanego w prerenderze (VITE_MM_COOKIE_BANNER_STATIC)
      rozstrzygana przed pierwszym malowaniem. Zgoda zapisana i poprawna (ta sama allowlista co
      utils/consentValue.ts: zwykły obiekt, dokładnie pola analytics i marketing, oba true/false)
      = baner ukryty, przycisk ustawień widoczny. Cokolwiek innego (brak wpisu, zły JSON, obce
      pole, błąd storage) = nic się nie zmienia, czyli baner widoczny jak przy braku zgody.
      Bez flagi klas mm-zgoda-* nie ma w HTML i skrypt niczego nie zmienia.
    -->
    <script>
      (function () {
        if (window.isPrerendering) return;
        try {
          var v = JSON.parse(window.localStorage.getItem('cookie-consent-v2'));
          var own = Object.prototype.hasOwnProperty;
          if (
            v !== null &&
            typeof v === 'object' &&
            !Array.isArray(v) &&
            Object.getPrototypeOf(v) === Object.prototype &&
            Object.keys(v).length === 2 &&
            own.call(v, 'analytics') &&
            own.call(v, 'marketing') &&
            typeof v.analytics === 'boolean' &&
            typeof v.marketing === 'boolean'
          ) {
            var s = document.createElement('style');
            s.textContent =
              '.mm-zgoda-baner{display:none!important}.mm-zgoda-przycisk{display:block!important}';
            document.head.appendChild(s);
          }
        } catch (e) {
          /* fail-closed: baner zostaje widoczny */
        }
      })();
    </script>

    <!--
      Cloudflare Zaraz jest wstrzykiwany automatycznie przez edge (autoInjectScript
      aktywny — HAR 2026-07-10 pokazal i.js x4). Reczny <script src="/cdn-cgi/zaraz/i.js">
      usuniety, bo powodowal podwojne ladowanie Zaraz i chaos skryptow (kolidowal
      z inicjalizacja Turnstile). Jesli Zaraz przestanie sie ladowac, znaczy ze
      auto-inject jest OFF — wtedy przywrocic ten tag.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
