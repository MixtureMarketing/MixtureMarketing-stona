<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Domyslny fallback title — React Helmet podmienia go per strone -->
    <title>Agencja Marketingowa Rzeszów — Mixture Marketing</title>

    <!-- Favicons & App Icons (Google Search Compliance) -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" href="/assets/images/sygnet.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/sygnet.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/sygnet.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/sygnet.png" />
    <meta name="theme-color" content="#213261" />

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdn.sanity.io" />
    <link rel="dns-prefetch" href="https://cdn.sanity.io" />

    <!-- Google Consent Mode v2 Default State -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500,
      });
    </script>

    <!--
      Cloudflare Zaraz: opt-out z autoInjectScript (PUT via API 2026-05-19).
      Wstrzykujemy ręcznie z `defer` zeby nie blokowal LCP.
      Skrypt /cdn-cgi/zaraz/i.js to standard endpoint Zaraz CDN (serwowany
      z edge'a). Backup configa: .zaraz-backup-2026-05-19.json.
      Aby przywrócić stare zachowanie: PUT autoInjectScript: true.
    -->
    <script defer src="/cdn-cgi/zaraz/i.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
